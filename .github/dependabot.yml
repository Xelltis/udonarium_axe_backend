version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/vercel は lockfile を持つ独立した npm プロジェクト
  - package-ecosystem: npm
    directory: /apps/vercel
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/cloudflare も lockfile を持つ独立した npm プロジェクト
  - package-ecosystem: npm
    directory: /apps/cloudflare
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
