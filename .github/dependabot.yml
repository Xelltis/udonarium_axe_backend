version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/vercel は lockfile を持つ独立した npm プロジェクト
  - package-ecosystem: npm
    directory: /apps/vercel
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/cloudflare も lockfile を持つ独立した npm プロジェクト
  - package-ecosystem: npm
    directory: /apps/cloudflare
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10
    ignore:
      # @cloudflare/vitest-pool-workers が抱える版に揃えて手で上げる。単独で上げると
      # テストと dev・deploy で workerd が分かれ、CI の「one workerd」チェックで落ちる
      - dependency-name: wrangler

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
