version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/vercel is a separate npm project with its own lockfile.
  - package-ecosystem: npm
    directory: /apps/vercel
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/cloudflare is a separate npm project with its own lockfile too.
  - package-ecosystem: npm
    directory: /apps/cloudflare
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10
    ignore:
      # Upgraded by hand, to the version @cloudflare/vitest-pool-workers carries. Upgraded alone,
      # the tests and dev and deploy would run different workerd, failing CI's "one workerd" check.
      - dependency-name: wrangler

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
