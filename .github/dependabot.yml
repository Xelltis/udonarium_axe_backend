version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # apps/vercel and apps/cloudflare are separate npm projects, each with its own lockfile. The code
  # they share needs its packages and Prettier at one version in both, which CI checks, so those go
  # up in one pull request for both apps; everything else in one per app.
  - package-ecosystem: npm
    directories:
      - /apps/vercel
      - /apps/cloudflare
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10
    groups:
      shared:
        group-by: dependency-name
        patterns:
          - '@msgpack/msgpack'
          - bcdice
          - hono
          - valibot
          - prettier
    ignore:
      # Upgraded by hand, to the version @cloudflare/vitest-plugin carries. Upgraded alone,
      # the tests and dev and deploy would run different workerd, failing CI's "one workerd" check.
      - dependency-name: wrangler

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /apps/php
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
