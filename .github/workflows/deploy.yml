name: Deploy

# Deploys the Cloudflare app and the Vercel app, at a release's tag, to each GitHub Environment named
# in CLOUDFLARE_DEPLOY_ENVIRONMENTS and VERCEL_DEPLOY_ENVIRONMENTS. release.yml calls it once it has
# made a release, so what runs is always a released version, and a push that makes no release (docs,
# CI, dependency updates) deploys nothing. Run it by hand from main (Actions → Deploy → Run workflow)
# with the latest tag to deploy again, as after changing an Environment's secrets. A fork that makes
# no releases deploys a commit instead (main, by hand).

on:
  workflow_call:
    inputs:
      ref:
        description: What to deploy, a release tag (v1.2.3) or a commit
        required: true
        type: string
  # By hand, one app can go alone, so that putting in the other's new settings leaves it be. A deploy
  # of the Cloudflare app starts its Durable Objects afresh, which drops the rooms' connections.
  workflow_dispatch:
    inputs:
      ref:
        description: What to deploy, a release tag (v1.2.3) or a commit (main in a fork that makes no releases)
        required: true
        type: string
      app:
        description: Which app to deploy
        type: choice
        options: [all, cloudflare, vercel]
        default: all

permissions: {}

jobs:
  # The targets go in the repository Variable CLOUDFLARE_DEPLOY_ENVIRONMENTS, as a JSON array of
  # GitHub Environment names (for example ["cloudflare-production", "cloudflare-public"]). Without it,
  # nothing is deployed. Each Environment holds these Secrets:
  #   - WORKER_NAME (the Worker's name. The first deploy creates the R2 bucket `<this name>-assets`)
  #   - ACCESS_CONTROL_ALLOW_ORIGIN (the origins that serve the app, comma-separated)
  #   - CLOUDFLARE_API_TOKEN (Workers Admin and R2 Storage Write and Read the first time, then narrowed
  #     to Workers Editor for that Worker alone. Keep it in an Environment only main can use)
  #   - CLOUDFLARE_ACCOUNT_ID (may be a repository Secret instead)
  #   - DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET and SESSION_SECRET (for login and rooms; all three or none)
  #   - SKYWAY_APP_ID and SKYWAY_SECRET (for SkyWay tokens; both or neither)
  #   - Each optional: ADMIN_DISCORD_IDS, ADMIN_WEBHOOK_URL, ADMIN_CONTACT_URL, ROOM_STORAGE_LIMIT_MB and
  #     ADMIN_STORAGE_ALERT_GB (the operator's dashboard and alerts, and a limit on each room's store)
  # ACCESS_CONTROL_ALLOW_ORIGIN, the three for login, the two for SkyWay and the operator's settings set
  # here are put in as Worker secrets again on every deploy, at the same version as the code. Secrets go
  # in alongside those the Worker has, so one taken out of the Environment stays on the Worker until it
  # is deleted there (in the dashboard, or with wrangler secret delete). ADMIN_PASSKEY_RESET, put in only
  # while an operator has lost every passkey, is kept to the dashboard.
  cloudflare:
    name: Cloudflare (${{ matrix.environment }})
    if: vars.CLOUDFLARE_DEPLOY_ENVIRONMENTS != '' && inputs.app != 'vercel'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.CLOUDFLARE_DEPLOY_ENVIRONMENTS) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-cloudflare-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/cloudflare

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/cloudflare/package.json
          cache: npm
          cache-dependency-path: apps/cloudflare/package-lock.json

      - run: npm ci

      # The secrets are written as JSON to the runner's temporary directory and sent along with the code
      # by --secrets-file. The local origin (localhost) in wrangler.jsonc's vars gives way to the secret of
      # the same name.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          ACCESS_CONTROL_ALLOW_ORIGIN: ${{ secrets.ACCESS_CONTROL_ALLOW_ORIGIN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SKYWAY_APP_ID: ${{ secrets.SKYWAY_APP_ID }}
          SKYWAY_SECRET: ${{ secrets.SKYWAY_SECRET }}
          ADMIN_DISCORD_IDS: ${{ secrets.ADMIN_DISCORD_IDS }}
          ADMIN_WEBHOOK_URL: ${{ secrets.ADMIN_WEBHOOK_URL }}
          ADMIN_CONTACT_URL: ${{ secrets.ADMIN_CONTACT_URL }}
          ROOM_STORAGE_LIMIT_MB: ${{ secrets.ROOM_STORAGE_LIMIT_MB }}
          ADMIN_STORAGE_ALERT_GB: ${{ secrets.ADMIN_STORAGE_ALERT_GB }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          for name in WORKER_NAME ACCESS_CONTROL_ALLOW_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the $ENVIRONMENT environment"
              exit 1
            fi
          done
          # The three for login go in together or not at all. With only some, the Worker answers config-invalid.
          login=0
          for name in DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET SESSION_SECRET; do
            [ -n "${!name}" ] && login=$((login + 1))
          done
          if [ "$login" -ne 0 ] && [ "$login" -ne 3 ]; then
            echo "::error::Set DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET and SESSION_SECRET together for the $ENVIRONMENT environment"
            exit 1
          fi
          # The two for SkyWay tokens likewise go in together or not at all.
          if { [ -n "$SKYWAY_APP_ID" ] && [ -z "$SKYWAY_SECRET" ]; } || { [ -z "$SKYWAY_APP_ID" ] && [ -n "$SKYWAY_SECRET" ]; }; then
            echo "::error::Set SKYWAY_APP_ID and SKYWAY_SECRET together for the $ENVIRONMENT environment"
            exit 1
          fi
          # The operator's settings are checked as the Worker checks them (src/core/config/admin.ts and
          # rooms.ts): one it would refuse has it answer config-invalid to every request. No value is
          # written to the log.
          bad() {
            echo "::error::$1 for the $ENVIRONMENT environment"
            exit 1
          }
          schemeOf() { node -e 'try { console.log(new URL(process.argv[1]).protocol) } catch { console.log("") }' "$1"; }
          if printf '%s' "$ADMIN_DISCORD_IDS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' |
            grep -Evq '^[0-9]{1,20}$'; then
            bad 'ADMIN_DISCORD_IDS must be Discord user ids separated by commas'
          fi
          if [ -n "$ADMIN_WEBHOOK_URL" ] && [ "$(schemeOf "$ADMIN_WEBHOOK_URL")" != 'https:' ]; then
            bad 'ADMIN_WEBHOOK_URL must be an https:// URL'
          fi
          if [ -n "$ADMIN_CONTACT_URL" ]; then
            case "$(schemeOf "$ADMIN_CONTACT_URL")" in
              https: | mailto:) ;;
              *) bad 'ADMIN_CONTACT_URL must be an https:// or mailto: URL' ;;
            esac
          fi
          if [ -n "$ROOM_STORAGE_LIMIT_MB" ] && ! { [[ "$ROOM_STORAGE_LIMIT_MB" =~ ^[0-9]+$ ]] &&
            [[ "$ROOM_STORAGE_LIMIT_MB" =~ [1-9] ]]; }; then
            bad 'ROOM_STORAGE_LIMIT_MB must be a whole number of MB above 0'
          fi
          if [ -n "$ADMIN_STORAGE_ALERT_GB" ] && ! { [[ "$ADMIN_STORAGE_ALERT_GB" =~ ^[0-9]+(\.[0-9]+)?$ ]] &&
            [[ "$ADMIN_STORAGE_ALERT_GB" =~ [1-9] ]]; }; then
            bad 'ADMIN_STORAGE_ALERT_GB must be a number of GB above 0'
          fi
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077 && jq -n '{ACCESS_CONTROL_ALLOW_ORIGIN: env.ACCESS_CONTROL_ALLOW_ORIGIN}
            + if (env.SESSION_SECRET // "") != "" then {
                DISCORD_CLIENT_ID: env.DISCORD_CLIENT_ID,
                DISCORD_CLIENT_SECRET: env.DISCORD_CLIENT_SECRET,
                SESSION_SECRET: env.SESSION_SECRET
              } else {} end
            + if (env.SKYWAY_SECRET // "") != "" then {
                SKYWAY_APP_ID: env.SKYWAY_APP_ID,
                SKYWAY_SECRET: env.SKYWAY_SECRET
              } else {} end
            + (["ADMIN_DISCORD_IDS", "ADMIN_WEBHOOK_URL", "ADMIN_CONTACT_URL", "ROOM_STORAGE_LIMIT_MB", "ADMIN_STORAGE_ALERT_GB"]
                | map(select(($ENV[.] // "") != "") | {(.): $ENV[.]}) | add // {})' > "$secrets")
          npx wrangler deploy --name "$WORKER_NAME" --secrets-file "$secrets"


  # The Vercel app goes up with the Vercel CLI it carries, built here and sent as it is, so that what
  # runs is the tag deployed. The project is kept off Vercel's Git integration, which would put every
  # push to main into production apart from the releases.
  # The targets go in the repository Variable VERCEL_DEPLOY_ENVIRONMENTS, as a JSON array of GitHub
  # Environment names (for example ["vercel-production"]). Without it, nothing is deployed. Each
  # Environment holds these Secrets:
  #   - VERCEL_TOKEN (a token made under the Vercel account's Settings → Tokens)
  #   - VERCEL_ORG_ID (the ID of the team, or of the account on Hobby, that owns the project)
  #   - VERCEL_PROJECT_ID (the project's ID. Its Root Directory is left empty, as the CLI runs in
  #     apps/vercel)
  # The app's own settings (ACCESS_CONTROL_ALLOW_ORIGIN, the three for login, Redis, Blob,
  # CRON_SECRET) stay in the Vercel project's environment variables, which the build pulls.
  vercel:
    name: Vercel (${{ matrix.environment }})
    if: vars.VERCEL_DEPLOY_ENVIRONMENTS != '' && inputs.app != 'cloudflare'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.VERCEL_DEPLOY_ENVIRONMENTS) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-vercel-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/vercel

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/vercel/package.json
          cache: npm
          cache-dependency-path: apps/vercel/package-lock.json

      - run: npm ci

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the $ENVIRONMENT environment"
              exit 1
            fi
          done
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
