name: Release

# On a push to main, runs CI's jobs again (ci.yml) and makes the release. When a release comes out,
# deploys the Cloudflare app and the Vercel app at its tag (deploy.yml); a push that makes none
# deploys nothing. A fork without RELEASE_TOKEN deploys every push instead. These live apart from
# ci.yml so that a pull request does not list them as skipped checks.

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      ref: ${{ steps.semantic.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build release archive
        run: |
          mkdir -p dist
          # Puts what is in apps/php at the top of the zip, so that where it is unpacked is the document root.
          (cd apps/php && zip -r ../../dist/udonarium-axe-backend.zip \
            index.php \
            .htaccess \
            .env.example \
            src/)
          zip dist/udonarium-axe-backend.zip \
            LICENSE \
            CHANGELOG.md \
            CONTRIBUTING.md

      - name: Install dependencies
        run: npm ci

      # Hands the deploy what to deploy as ref: the tag of the release made just now, or nothing when
      # no release came out. A release commits CHANGELOG.md and tags that commit, so a new HEAD with a
      # tag on it is that release. A fork without RELEASE_TOKEN makes no releases, and deploys what
      # reached main instead, as on every push.
      - name: Release
        id: semantic
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::No RELEASE_TOKEN, so no release is made and what reached main is deployed"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          npx semantic-release
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ "$(git rev-parse HEAD)" != "$before" ] && [ -n "$tag" ]; then
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "::notice::Released $tag"
          fi
        env:
          # The main ruleset requires a PR and status checks, so GITHUB_TOKEN cannot push
          # @semantic-release/git's release commit. Uses the PAT of an organization admin,
          # who is on the bypass list.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  deploy:
    name: Deploy
    needs: [release]
    if: needs.release.outputs.ref != ''
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.ref }}
    secrets: inherit
