name: CI

# Every app's checks, on a pull request to main whatever it changed. release.yml runs the same jobs
# again on main, through workflow_call, before it deploys and releases.

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    defaults:
      run:
        working-directory: apps/php

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcov
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check --diff --format=checkstyle | vendor/bin/cs2pr

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=256M --error-format=github

      - uses: mheap/phpunit-matcher-action@v1

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml --log-junit=junit.xml --display-deprecations

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.php == '8.5'
        with:
          files: apps/php/coverage.xml
          flags: php
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Runs even after a failure, since the results matter most when a test fails.
      # A missing junit.xml, after an earlier step failed, is not taken as an error.
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          files: apps/php/junit.xml
          disable_search: true
          handle_no_reports_found: true
          flags: php${{ matrix.php }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  vercel:
    name: Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vercel
    # For the tests that use the room server's store (Redis).
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/vercel/package.json
          cache: npm
          cache-dependency-path: apps/vercel/package-lock.json

      - run: npm ci

      # src/core, contracts and test/shared are copied from apps/cloudflare. A stale copy fails here.
      - name: Check that the code shared with the Cloudflare app is in step
        run: node ../../scripts/sync-shared.mjs --check

      - run: npm run lint

      - run: npm run format:check

      # Only this step catches a relative import missing its extension.
      # Vercel transpiles without checking types, so a missing one becomes
      # ERR_MODULE_NOT_FOUND in production (see b0995cc).
      - run: npm run typecheck

      # The tests go through Vite, so they miss imports that bare Node cannot read (a JSON import
      # missing its attribute, say). Reads what tsc puts out with bare Node, and rolls BCDice once.
      - run: npm run check:esm

      - run: npm test

      # Uploads even when npm test fails on the coverage threshold, so that the lines
      # that fell short can be traced on Codecov.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: apps/vercel/coverage/lcov.info
          flags: vercel
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - run: npm run coverage:check

  cloudflare:
    name: Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloudflare

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/cloudflare/package.json
          cache: npm
          cache-dependency-path: apps/cloudflare/package-lock.json

      - run: npm ci

      # The tests run on the wrangler and workerd that vitest-pool-workers carries. The wrangler for dev
      # and deploy is kept at the same version, so that nothing runs on a runtime other than the tests'
      # (upgrading wrangler alone fails here).
      - name: Check that the tests and wrangler share one workerd
        run: test "$(npm query '#workerd' | jq '[.[].version] | unique | length')" = 1

      # src/core, contracts and test/shared are copied to apps/vercel. A stale copy fails here.
      - name: Check that the code shared with the Vercel app is in step
        run: node ../../scripts/sync-shared.mjs --check

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # Runs in the Workers runtime (workerd), with R2 and the rate limits stood up locally.
      # Fails when coverage drops below 100%.
      - run: npm test

      # Uploads even when npm test fails on the coverage threshold, so that the lines
      # that fell short can be traced on Codecov.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: apps/cloudflare/coverage/lcov.info
          flags: cloudflare
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
