name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    defaults:
      run:
        working-directory: apps/php

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcov
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check --diff --format=checkstyle | vendor/bin/cs2pr

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=256M --error-format=github

      - uses: mheap/phpunit-matcher-action@v1

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml --log-junit=junit.xml --display-deprecations

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.php == '8.5'
        with:
          files: apps/php/coverage.xml
          flags: php
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # テストが落ちたときこそ結果を送りたいので、失敗後も実行する。
      # 先行ステップの失敗で junit.xml が無い場合はエラー扱いにしない。
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          files: apps/php/junit.xml
          disable_search: true
          handle_no_reports_found: true
          flags: php${{ matrix.php }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  vercel:
    name: Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vercel
    # 部屋のサーバーの置き場所（Redis）を使うテストのため
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/vercel/package.json
          cache: npm
          cache-dependency-path: apps/vercel/package-lock.json

      - run: npm ci

      # src/core・contracts・test/shared は apps/cloudflare から写したもの。写しが古いとここで落ちる
      - name: Check that the code shared with the Cloudflare app is in step
        run: node ../../scripts/sync-shared.mjs --check

      - run: npm run lint

      # 相対 import の拡張子漏れはここでしか検出できない。
      # Vercel は型チェックせずトランスパイルするため、抜けると本番で
      # ERR_MODULE_NOT_FOUND になる (b0995cc 参照)。
      - run: npm run typecheck

      # テストは Vite を通すので、素の Node で読めない import（JSON の import 属性の漏れなど）を
      # 見逃す。tsc で出したものを素の Node で読み、BCDice を1回振る
      - run: npm run check:esm

      - run: npm test

      # カバレッジ閾値割れで npm test が落ちた場合も、どの行が落ちたかを
      # Codecov 上で追えるようアップロードは実行する。
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: apps/vercel/coverage/lcov.info
          flags: vercel
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - run: npm run coverage:check

  cloudflare:
    name: Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloudflare

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/cloudflare/package.json
          cache: npm
          cache-dependency-path: apps/cloudflare/package-lock.json

      - run: npm ci

      # テストは vitest-pool-workers が抱える wrangler と workerd で動く。dev と deploy の wrangler を
      # 同じ版に揃え、テストと違うランタイムで動かさないようにする（wrangler だけ上げると落ちる）
      - name: Check that the tests and wrangler share one workerd
        run: test "$(npm query '#workerd' | jq '[.[].version] | unique | length')" = 1

      # src/core・contracts・test/shared は apps/vercel に写して使う。写しが古いとここで落ちる
      - name: Check that the code shared with the Vercel app is in step
        run: node ../../scripts/sync-shared.mjs --check

      - run: npm run lint

      - run: npm run typecheck

      # Workers のランタイム（workerd）の中で、R2 とレート制限をローカルに立てて流す。
      # カバレッジが 100% を切ると落ちる
      - run: npm test

      # カバレッジ閾値割れで npm test が落ちた場合も、どの行が落ちたかを
      # Codecov 上で追えるようアップロードは実行する。
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: apps/cloudflare/coverage/lcov.info
          flags: cloudflare
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # main に入ったものを、Cloudflare のジョブが通ってから Worker に出す。
  # 出し先はリポジトリの Variable CLOUDFLARE_DEPLOY_ENVIRONMENTS に、GitHub Environment の名前の
  # JSON 配列で書く（例: ["cloudflare-production", "cloudflare-public"]）。無ければ何もしない。
  # Environment ごとに、次の Secret を置く。
  #   - WORKER_NAME（Worker の名前。R2 のバケットは最初のデプロイで「<この名前>-assets」が作られる）
  #   - ACCESS_CONTROL_ALLOW_ORIGIN（アプリを配信している Origin。カンマ区切り）
  #   - CLOUDFLARE_API_TOKEN（初回は Workers Admin と R2 Storage Write・Read、2回目からは
  #     そのWorkerだけの Workers Editor に絞る。main だけが使える Environment に置く）
  #   - CLOUDFLARE_ACCOUNT_ID（リポジトリの Secret に置いてもよい）
  #   - DISCORD_CLIENT_ID・DISCORD_CLIENT_SECRET・SESSION_SECRET（ログインと部屋を使うとき。3つそろえる）
  # ACCESS_CONTROL_ALLOW_ORIGIN とログインの3つは Worker のシークレットとして、デプロイのたびにコードと同じ版で入れ直す。
  deploy-cloudflare:
    name: Deploy Cloudflare (${{ matrix.environment }})
    needs: [cloudflare]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENVIRONMENTS != ''
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.CLOUDFLARE_DEPLOY_ENVIRONMENTS) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-cloudflare-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/cloudflare

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/cloudflare/package.json
          cache: npm
          cache-dependency-path: apps/cloudflare/package-lock.json

      - run: npm ci

      # シークレットはランナーの一時ディレクトリに JSON で書き、--secrets-file でコードと一緒に送る。
      # wrangler.jsonc の vars にある手元用の Origin（localhost）は、同じ名前のシークレットで置き換わる
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          ACCESS_CONTROL_ALLOW_ORIGIN: ${{ secrets.ACCESS_CONTROL_ALLOW_ORIGIN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          for name in WORKER_NAME ACCESS_CONTROL_ALLOW_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the $ENVIRONMENT environment"
              exit 1
            fi
          done
          # ログインの3つは、そろえて置くか、どれも置かないか。一部だけだと Worker が config-invalid を返す
          login=0
          for name in DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET SESSION_SECRET; do
            [ -n "${!name}" ] && login=$((login + 1))
          done
          if [ "$login" -ne 0 ] && [ "$login" -ne 3 ]; then
            echo "::error::Set DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET and SESSION_SECRET together for the $ENVIRONMENT environment"
            exit 1
          fi
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077 && jq -n '{ACCESS_CONTROL_ALLOW_ORIGIN: env.ACCESS_CONTROL_ALLOW_ORIGIN}
            + if (env.SESSION_SECRET // "") != "" then {
                DISCORD_CLIENT_ID: env.DISCORD_CLIENT_ID,
                DISCORD_CLIENT_SECRET: env.DISCORD_CLIENT_SECRET,
                SESSION_SECRET: env.SESSION_SECRET
              } else {} end' > "$secrets")
          npx wrangler deploy --name "$WORKER_NAME" --secrets-file "$secrets"

  release:
    name: Release
    needs: [test, vercel, cloudflare]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build release archive
        run: |
          mkdir -p dist
          # 展開した先がそのままドキュメントルートになるよう、apps/php の中身を zip の直下に置く
          (cd apps/php && zip -r ../../dist/udonarium-axe-backend.zip \
            index.php \
            .htaccess \
            .env.example \
            src/ \
            docs/ \
            README.md)
          zip dist/udonarium-axe-backend.zip \
            LICENSE \
            CHANGELOG.md \
            CONTRIBUTING.md

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          # main の ruleset で PR 必須・必須ステータスチェックを課しているため、
          # GITHUB_TOKEN では @semantic-release/git のリリースコミットが弾かれる。
          # bypass 対象である Organization 管理者の PAT を使う。
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
