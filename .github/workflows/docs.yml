name: Docs

# Builds the VitePress site in docs/ and publishes it to GitHub Pages, when main gets a change to it.
# A pull request checks the same build in CI's Docs job (ci.yml) instead.
# Publishing needs the repository's Settings → Pages → Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'development/**'
      - 'scripts/check-doc-anchors.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The "last updated" dates come from the commit history, so the whole history is fetched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run docs:check

      - run: npm run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
