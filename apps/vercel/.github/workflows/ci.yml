name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      # 相対 import の拡張子漏れはここでしか検出できない。
      # Vercel は型チェックせずトランスパイルするため、抜けると本番で
      # ERR_MODULE_NOT_FOUND になる (b0995cc 参照)。
      - run: npm run typecheck

      - run: npm test

      # カバレッジ閾値割れで npm test が落ちた場合も、どの行が落ちたかを
      # Codecov 上で追えるようアップロードは実行する。
      #
      # public リポジトリなので token なしで運用する (Xelltis の Global Upload
      # Token は Not required)。fork からの PR は secrets を読めないため、
      # トークン運用にすると fork PR のアップロードが必ず失敗する。
      # 下の token 行は secret 未設定なら空文字が渡って tokenless に落ちる。
      # 将来 Global Upload Token を Required に変えても、secret を追加するだけで
      # ワークフローを触らずに済むよう残してある。
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - run: npm run coverage:check
