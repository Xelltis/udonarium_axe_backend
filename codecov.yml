# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    # カバレッジを上げるのは PHP 8.5 ジョブと Vercel ジョブと Cloudflare ジョブの 3 つ
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  # apps/php/src/ と apps/vercel の src/・api/ と apps/cloudflare/src/ は現状 100%。低下が色で分かるよう下限を高めに置く
  range: "90...100"
  status:
    project:
      default:
        target: auto
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        only_pulls: true

# アプリごとにフラグを分け、片方だけ変えた PR でももう片方の値を引き継ぐ
flags:
  php:
    paths:
      - apps/php/
    carryforward: true
  vercel:
    paths:
      - apps/vercel/
    carryforward: true
  cloudflare:
    paths:
      - apps/cloudflare/
    carryforward: true

comment:
  layout: "header, diff, flags, files"
  behavior: default
  # テスト結果はカバレッジコメントに同梱されるため、カバレッジ不変の PR で
  # コメントを抑制するとテスト失敗も表に出ない。require_changes にテスト失敗の
  # 条件は無いので false にする。
  require_changes: false

# PHP の計測対象は apps/php/phpunit.xml の <source> で src/ に限定済み。
# Vercel と Cloudflare の除外は、それぞれの vitest.config.ts の coverage.exclude と対応させる。
# どちらも、レポーターや <source> の設定が変わっても意図が崩れないよう明示する。
ignore:
  - "apps/php/tests/**"
  - "apps/php/bin/**"
  - "apps/php/docs/**"
  - "apps/php/vendor/**"
  - "apps/php/index.php"
  - "apps/vercel/test/**"
  - "apps/vercel/scripts/**"
  - "apps/vercel/src/**/types.ts"
  - "apps/vercel/src/http/context.ts"
  - "apps/cloudflare/test/**"
  - "apps/cloudflare/src/**/*.d.ts"
  - "apps/cloudflare/src/http/context.ts"
  - "stubs/**"
